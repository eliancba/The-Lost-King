import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const materialTextures=new Map();
function surface(T,kind){
 if(materialTextures.has(kind))return materialTextures.get(kind);

 let seed=203;
 const rand=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296);
 for(let y=0;y<128;y++)for(let x=0;x<128;x++){
  const n=rand(), cloud=Math.sin(x*.18+Math.sin(y*.095)*2)*Math.cos(y*.15);
  let v=194+cloud*24+n*28;
  if(kind==='wood')v=186+Math.sin(y*.85+Math.sin(x*.095)*1.4)*22+cloud*12+n*22;
  if(kind==='water')v=182+Math.pow(Math.max(0,Math.sin(y*.26+Math.sin(x*.13)*1.9+Math.sin(y*.08+x*.09))),7)*59+cloud*12;
  if(kind==='grass')v=173+cloud*32+n*25+Math.sin(x*.49+y*.23)*10;
  if(kind==='dirt')v=159+cloud*33+n*38+Math.sin(x*.35+y*.093)*10;
  if(kind==='road'){
   const row=Math.floor(y/27), joint=(x+(row%2)*16)%32;
   v=(y%27<2||joint<2)?102+n*18:166+cloud*29+n*34+(row%3)*8;
  }
  if(kind==='cloth')v=186+n*23+(x%3===0||y%3===0?-14:15);
  if(kind==='stone'&&(y%32<2||(x+(Math.floor(y/32)%2)*16)%32<2))v*=.52;
  data.data.set([v,v,v,255],(y*128+x)*4);
 }
 c.putImageData(data,0,0);
 if(kind==='grass')for(let i=0;i<2100;i++){
  const x=rand()*128,y=rand()*128;
  c.strokeStyle=i%4===0?'#e4dfaa75':'#33432d63';
  c.beginPath();c.moveTo(x,y);c.lineTo(x+rand()*2-1,y-1-rand()*3);c.stroke();
 }
 const t=new T.CanvasTexture(tile);t.colorSpace=T.SRGBColorSpace;t.wrapS=t.wrapT=T.RepeatWrapping;
 t.anisotropy=4;materialTextures.set(kind,t);return t;
}
function nearTrail(x,z,segments,margin){
 return segments.some(([ax,az,bx,bz,width])=>{
  const dx=bx-ax,dz=bz-az;
  const t=Math.min(1,Math.max(0,((x-ax)*dx+(z-az)*dz)/(dx*dx+dz*dz||1)));
  return Math.hypot(x-ax-t*dx,z-az-t*dz)<width/2+margin;
 });
}
function plantScenery(T,scene,trees,bushes){

  new T.MeshStandardMaterial({color:0x66503a,map:surface(T,'wood'),roughness:1}),
  new T.MeshStandardMaterial({color:0x344b34,flatShading:true,roughness:1}),
  new T.MeshStandardMaterial({color:0x55704a,flatShading:true,roughness:1})
 ];
 const bark=new T.InstancedMesh(new T.CylinderGeometry(.10,.24,2.6,7),materials[0],trees.length);
 const crowns=new T.InstancedMesh(new T.IcosahedronGeometry(1,1),materials[1],trees.length*4);
 const scrub=new T.InstancedMesh(new T.IcosahedronGeometry(1,0),materials[2],bushes.length*2);
 const o=new T.Object3D(), tint=new T.Color();
 function put(mesh,i,x,y,z,sx,sy,sz,turn,light){
  o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.rotation.set(0,turn,0);o.updateMatrix();
  mesh.setMatrixAt(i,o.matrix);mesh.setColorAt(i,tint.setRGB(light,light,light));
 }
 trees.forEach(([x,z,k],i)=>{
  put(bark,i,x,1.25*k,z,k,k,k,i,.76+(i%4)*.07);
  for(let j=0;j<4;j++){
   const angle=i*2.4+j*2.09, arm=j===3?0:.79*k;
   put(crowns,i*4+j,x+Math.cos(angle)*arm,(j===3?3.95:2.78+j*.21)*k,z+Math.sin(angle)*arm,
    k*(1.12+j%2*.14),k*(1.13+j*.14),k*(1.02+j%2*.24),angle,.75+(i+j*3)%7*.067);
  }
 });
 bushes.forEach(([x,z,k],i)=>{
  for(let j=0;j<2;j++)put(scrub,i*2+j,x+(j-.5)*.57*k,(.24+j*.09)*k,z,k*.48,k*.35,k*.57,
   i+j,.62+(i+j)%5*.11);
 });
 scene.add(bark,crowns,scrub);
}

  }

 }
 for(const side of [-1,1])for(let i=0;i<9;i++){

 for(const side of [-1,1]){

 for(let i=0;i<14;i++)slab(0,riverZ-3.9+i*.6,6.5,.12,.56,i%3===0?trim:stone,false,.11);

 for(let i=0;i<21;i++) slab(ford,riverZ-5.5+i*.55,3.1,.11,.50,deck,false,.133);
 for(const x of [ford-1.45,ford+1.45])for(const z of [25,29,33]) slab(x,z,.19,.69,.19,stone,false,.39);

  map:atlas,transparent:false,alphaTest:.45,color:owner===1?0xc0d9c2:owner===2?0x91ad78:0xffffff
 }));
 const shadow=new T.Mesh(new T.CircleGeometry(1,12),new T.MeshBasicMaterial({color:0x080d0a,transparent:true,opacity:.45,depthWrite:false}));
 shadow.rotation.x=-Math.PI/2;
 scene.add(shadow,sprite);
 const hp=kind===2?430:kind===1?46:150, size=kind===2?10.7:kind===1?1.8:2.25;
 return {kind,owner,x,z,hp,max:hp,size,dx:0,dz:1,walk:0,cd:0,wind:0,dash:0,flash:0,sprite,shadow};
}
function dispose(a){for(const mesh of [a.sprite,a.shadow]){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose();}}
function walk(a,dx,dz){
 const valid=(x,z)=>intro?Math.abs(x)<4.5&&Math.abs(z)<35:sector<0?overworld.land(x,z):Math.abs(x)<64&&Math.abs(z)<65&&!world.blocks.some(b=>(!b.river||Math.abs(x-world.ford)>1.18)&&Math.abs(x-b.x)<b.w/2+.32&&Math.abs(z-b.z)<b.d/2+.32);
 if(valid(a.x+dx,a.z))a.x+=dx;
 if(valid(a.x,a.z+dz))a.z+=dz;
}
function effect(a,r,color,life=.24){
 const ring=new T.Mesh(new T.RingGeometry(r*.83,r,30),new T.MeshBasicMaterial({color,transparent:true,opacity:.7,depthWrite:false,side:T.DoubleSide}));
 ring.rotation.x=-Math.PI/2;ring.position.set(a.x,.055,a.z);scene.add(ring);effects.push({ring,life,max:life});
}
function damage(a,n){a.hp=Math.max(0,a.hp-n);a.flash=.16;}
function playerStep(p,dt){
 if(!p.hp)return;
 p.rageCD=Math.max(0,(p.rageCD??0)-dt);
 if(armored&&p.rageCD===0&&pressed.has(p.owner===0?'KeyQ':'KeyO')){
  p.rageCD=4;playSfx('skill');effect(p,5.2,0xb74842,.48);skillBurst([p],10);
  for(const e of enemies)if(e.hp&&Math.hypot(e.x-p.x,e.z-p.z)<5.2)damage(e,74);
 }
 const k=controls[p.owner], dx=+keys.has(k.right)-+keys.has(k.left), dz=+keys.has(k.down)-+keys.has(k.up);
 const length=Math.hypot(dx,dz);p.moving=Boolean(length);
 p.cd=Math.max(0,p.cd-dt);p.dashCD=Math.max(0,p.dashCD-dt);
 if(length&&p.dash<=0){p.dx=dx/length;p.dz=dz/length;}
 if(pressed.has(k.dash)&&p.dashCD===0){p.wind=0;p.dash=.19;p.dashCD=.85;effect(p,.72,0x8a7962);}
 if(p.dash>0){const slice=Math.min(dt,p.dash);walk(p,p.dx*16*slice,p.dz*16*slice);p.dash-=slice;}
 else if(length){walk(p,p.dx*5.9*dt,p.dz*5.9*dt);p.walk+=dt*11;}
 if(pressed.has(k.attack)&&p.cd===0&&p.dash===0){p.wind=.11;p.cd=.34;}
 if(p.wind>0){
  p.wind=Math.max(0,p.wind-dt);
  if(p.wind===0){
   playSfx('slash');
   effect({x:p.x+p.dx*.63,z:p.z+p.dz*.63},2.05,p.owner?0x91af91:0xd5a566);
   let connected=false;
   for(const e of enemies){
    const dx=e.x-p.x,dz=e.z-p.z,d=Math.hypot(dx,dz);
    if(e.hp&&d<(e.kind===2?3.3:2.8)&&dx*p.dx+dz*p.dz>=d*.12){
     damage(e,armored?58:32);walk(e,p.dx*.55,p.dz*.55);connected=true;
    }
   }
   if(connected)playSfx('steel');
  }
 }
}
function skyFlare(point,duration){
 const group=new T.Group();
 group.position.set(point.x,0,point.z);
 const core=new T.Mesh(new T.SphereGeometry(.75,16,12),new T.MeshBasicMaterial({color:0xffbc68}));
 const tail=new T.Mesh(new T.SphereGeometry(1.05,14,10),new T.MeshBasicMaterial({
  color:0xe04c22,transparent:true,opacity:.68,depthWrite:false
 }));
 tail.scale.y=1.24;tail.position.y=.16;group.add(tail,core);scene.add(group);
 effects.push({ring:group,life:duration+.22,max:duration+.22,duration,sky:true});
}
function clearEffect(effect){
 scene.remove(effect.ring);
 effect.ring.traverse(mesh=>{if(mesh.isMesh){mesh.geometry.dispose();mesh.material.dispose();}});
}
const apostles=[
 {name:'La Sierpe del Atrio',power:'Veneno',color:0xa6b561,range:3.7,time:1.05,damage:43},
 {name:'El Astado del Espino',power:'Embestida',color:0xdd8464,range:1.85,time:.92,damage:49},
 {name:'El Cazador de Ceniza',power:'Salva de fuego',color:0xe69d46,range:2.1,time:1.19,damage:45}

function skillBurst(points,art){
 const group=new T.Group(), geometry=new T.IcosahedronGeometry(.2,0);
 const material=new T.MeshBasicMaterial({color:art===8?0xa8bc6d:art===9?0xac7257:0xffa756});
 const particles=[];
 for(const [index,p] of points.entries())for(let i=0;i<9;i++){
  const mesh=new T.Mesh(geometry,material);
  const a=i*2.4+index;
  mesh.position.set(p.x,.12,p.z);group.add(mesh);
  particles.push({mesh,x:p.x,z:p.z,vx:Math.cos(a)*(2+i%3),vz:Math.sin(a)*(2+i%3),vy:.8+i%4});
 }
 scene.add(group);effects.push({ring:group,life:.48,max:.48,particles});
}
function bossSkill(e,target){
 playSfx('skill');
 const art=e.apostle;
 const dx=target.x-e.x,dz=target.z-e.z,d=Math.hypot(dx,dz)||1;
 const ux=dx/d,uz=dz/d;
 const centers=e.art===9?[2,4,6,8].map(n=>({x:e.x+ux*n,z:e.z+uz*n})):
  e.art===10?[-2.35,0,2.35].map(n=>({x:target.x-uz*n,z:target.z+ux*n})):
  [{x:target.x,z:target.z}];
 e.skill={centers};e.range=art.range;e.wind=art.time;
 for(const center of centers){
  effect(center,e.range,art.color,e.wind);
  if(e.art===10)skyFlare(center,e.wind);
 }
}

function enemyStep(e,dt){
 const alive=players.filter(p=>p.hp);
 const p=alive.sort((a,b)=>Math.hypot(a.x-e.x,a.z-e.z)-Math.hypot(b.x-e.x,b.z-e.z))[0];
 if(!p)return;
 const dx=p.x-e.x,dz=p.z-e.z,d=Math.hypot(dx,dz), boss=e.kind===2;
 const watcher=e.art===4, brute=e.art===5;
 e.cd=Math.max(0,e.cd-dt);e.moving=false;
 if(e.wind>0){
  e.wind=Math.max(0,e.wind-dt);
  if(!e.wind){
   const impacts=e.skill?.centers??[e.skill??e];
   const tint=boss&&e.skill?e.apostle.color:0x9e4433;
   for(const impact of impacts){
    effect(impact,e.range,tint,.38);
    if(e.skill)effect(impact,e.range*.56,tint,.22);
   }
   if(boss&&e.skill){skillBurst(impacts,e.art);playSfx('impact');}
   if(boss&&e.art===9&&e.skill){
    const end=impacts[impacts.length-1];
    const x=e.x,z=e.z;
    for(let i=0;i<12;i++)walk(e,(end.x-x)/12,(end.z-z)/12);
   }
   for(const p of alive)if(p.dash<=0&&impacts.some(impact=>Math.hypot(p.x-impact.x,p.z-impact.z)<e.range))
    damage(p,boss?(e.skill?e.apostle.damage:39):watcher?13:brute?24:16);
   e.skill=null;
   e.cd=boss?(e.hp<e.max/2?.5:1):.64;
  }
 }else{
  if(d>.04){e.dx=dx/d;e.dz=dz/d;}
  if(boss&&d<11&&e.cd===0&&(e.useSkill||d>=4.8)){
   bossSkill(e,p);e.useSkill=false;
  }else if(watcher&&d<6.1&&!e.cd){
   e.skill={x:p.x,z:p.z};e.range=1.46;e.wind=.71;
   effect(e.skill,e.range,0xad7297,e.wind);
  }else if(d<(boss?4.8:brute?2.1:1.55)&&e.cd===0){
   if(boss)e.useSkill=true;
   e.range=boss?(e.hp<e.max/2?4.65:3.95):brute?2.35:1.75;
   e.wind=boss?.84:brute?.69:.42;effect(e,e.range,0x753b2c,e.wind);
  }else if(d>(boss?2.65:1.12)){
   const speed=boss?2.25:brute?2.15:watcher?3.12:2.85;
   let sx=e.dx,sz=e.dz;
   for(const other of enemies){
    const x=e.x-other.x,z=e.z-other.z,s=Math.hypot(x,z);
    if(other!==e&&other.hp&&s>.01&&s<1.25){sx+=x/s*(1.25-s);sz+=z/s*(1.25-s);}
   }
   walk(e,sx*speed*dt,sz*speed*dt);e.walk+=dt*9;e.moving=true;
  }
 }
}
const arrows=[];
function stepArcher(dt){
 for(let i=arrows.length-1;i>=0;i--){
  const a=arrows[i];a.life-=dt;
  if(!a.target.hp||!enemies.includes(a.target)||a.life<=0){
   if(a.target.hp&&enemies.includes(a.target))damage(a.target,13);
   scene.remove(a.mesh);a.mesh.geometry.dispose();a.mesh.material.dispose();arrows.splice(i,1);
  }else{
   const t=1-a.life/.24;
   a.mesh.position.set(a.x+(a.target.x-a.x)*t,.9+Math.sin(t*Math.PI)*.4,a.z+(a.target.z-a.z)*t);
  }
 }
 if(!archer)return;
 const lead=players.find(p=>p.hp);
 if(!lead)return;
 const dx=lead.x-archer.x,dz=lead.z-archer.z,d=Math.hypot(dx,dz);
 archer.moving=d>2.6;archer.cd=Math.max(0,archer.cd-dt);
 if(d>12){archer.x=lead.x;archer.z=lead.z;return;}
 if(archer.moving){
  archer.dx=dx/d;archer.dz=dz/d;walk(archer,archer.dx*4.8*dt,archer.dz*4.8*dt);archer.walk+=dt*10;
 }
 if(!archer.cd){
  const target=enemies.find(e=>e.hp&&Math.hypot(e.x-archer.x,e.z-archer.z)<9);
  if(!target)return;
  const mesh=new T.Mesh(new T.BoxGeometry(.075,.07,.56),new T.MeshBasicMaterial({color:0xe3be77}));
  mesh.position.set(archer.x,1,archer.z);mesh.rotation.y=Math.atan2(target.x-archer.x,target.z-archer.z);
  scene.add(mesh);arrows.push({mesh,target,x:archer.x,z:archer.z,life:.24});archer.cd=.86;
 }
}
function summonWave(site,stage){
 const count=(players.length===2?7:5)+(stage===2?1:0);
 const [x,z]=stage===1&&nearby(...site.ambush,8)?site.ambush:[site.x,site.z];
 for(let i=0;i<count;i++){
  const angle=(i-(count-1)/2)*.48+(stage===2?Math.PI:0);
  const enemy=actor(1,x+Math.sin(angle)*5.7,z-Math.cos(angle)*4.1);
  enemy.art=i%4===2?4:stage===2&&i%3===0?5:1;
  if(enemy.art===4){enemy.hp=enemy.max=35;enemy.size*=1.08;}
  if(enemy.art===5){enemy.hp=enemy.max=69;enemy.size*=1.30;}
  enemies.push(enemy);
 }
}
function progressFinale(){
 if(!armored||finishedStory||enemies.some(e=>e.hp))return;
 if(finaleStep===1){
  finaleStep=1.5;
  for(const [i,x,z] of [[0,-7,20],[1,3,17],[2,10,11],[3,-12,8],[4,-5,3],[5,5,2],[6,11,-3],[7,-10,-5]]){
   const demon=actor(1,x,z);demon.art=[1,4,5][i%3];demon.hp=demon.max=i%3===2?82:54;
   enemies.push(demon);
  }
 }else if(finaleStep===1.5){
  finaleStep=2;
  for(const [i,x,z] of [[0,-10,-14],[1,0,-20],[2,10,-14]]){
   const boss=actor(2,x,z);boss.art=8+i;boss.apostle=apostles[i];boss.useSkill=Boolean(i%2);
   boss.hp=boss.max=players.length===2?290:240;
   enemies.push(boss);effect(boss,3.7,0xc27859,.8);
  }
 }else if(finaleStep===2){
  finaleStep=3;armored=false;
  for(const p of players)p.hp=p.max;
  tell('El peso del acero se desprende de tus hombros. El rey sigue vivo en el torreón.','Caballero');
 }
}
function progress(){
 if(sector===finaleSector){progressFinale();return;}
 const site=world.sites[0];
 if(!site)return;
 const demons=enemies.some(e=>e.kind===1&&e.hp);
 const byAmbush=nearby(...site.ambush,8);
 const byBoss=nearby(site.x,site.z,6.8);
 if(!demons&&site.phase!==3&&site.wave!==2&&(site.wave===1?byBoss:byAmbush||byBoss)){
  site.wave=(site.wave??0)+1;
  summonWave(site,site.wave);
 }
 if(byBoss&&!site.phase){
  site.phase=2;
  const boss=actor(2,site.x,site.z);
  boss.art=8+sector;boss.apostle=apostles[sector];boss.useSkill=true;enemies.push(boss);
  effect(boss,3.15,0xdda96a,.7);
 }
 if(site.phase===2&&!enemies.some(e=>e.kind===2&&e.hp)){
  site.phase=3;victories.add(sector);
  for(const p of players)p.hp=p.max;
 }
}
function relocate(next,x,z){
 if(sector>=0){
  const site=districts[sector];
  if(site){
   if(site.phase>=2)site.phase=0;
   if(enemies.some(e=>e.kind===1&&e.hp))site.wave=0;
  }
  for(const e of enemies)dispose(e);
  enemies.length=0;
 }
 for(const arrow of arrows){scene.remove(arrow.mesh);arrow.mesh.geometry.dispose();arrow.mesh.material.dispose();}
 arrows.length=0;
 world.group.visible=false;sector=next;world=maps[next]??overworld;world.group.visible=true;
 for(const effect of effects)clearEffect(effect);
 effects.length=0;
 for(let i=0;i<players.length;i++){
  const p=players[i];p.x=x+i*1.2-.6;p.z=z;p.dash=p.wind=0;
 }
 if(archer){archer.x=x;archer.z=z+1;archer.wind=0;}
 look.set(x,0,z);camera.zoom=1;camera.updateProjectionMatrix();
 crossing=.3;overworld.update();refresh();
}
function nearby(x,z,distance){
 return players.some(p=>p.hp&&Math.hypot(p.x-x,p.z-z)<distance);
}
function localPoint(){
 return sector<0?null:world.points.find(p=>nearby(p.x,p.z,2.7));
}
function explorePoint(point){
 if(!point)return false;
 const key=sector+point.kind, known=discovered.has(key);
 if(enemies.length&&point.kind==='camp'){tell('El campamento está expuesto. Despejá la zona antes de descansar.');return true;}
 discovered.add(key);
 if(point.kind==='camp'){
  if(!known)for(const p of players)if(p.hp)p.hp=Math.min(p.max,p.hp+55);
  tell(known?'Las provisiones de este campamento ya se usaron.':'Encontraron provisiones entre las tiendas. Cada caballero en pie recuperó hasta 55 PV.');
 }else if(point.kind==='watch'){
  tell('Desde la atalaya se ve el recinto del guardián. El puente lateral cruza el río y el sendero del santuario vuelve al camino central.');
 }else{
  tell(['En la piedra: «Si cae el puente principal, llevad al rey por el paso de los lobos».',
   'Las marcas de garras atraviesan el altar. Debajo quedó un fragmento de la insignia real.',
   'La piedra lleva el sello del rey. Una inscripción reciente señala la costa oriental.'][sector]);
 }
 return true;
}
function finaleInteractions(){
 if(!pressed.has('KeyE'))return;
 if(finaleStep===0&&nearby(0,33,3.6)){
  dialogue=[
   ['Ente','Tres apóstoles cercan al rey. Si cruzás como estás, vas a morir.'],
   ['Ente','Esta armadura te dará fuerza para matarlos. Cada golpe la hundirá un poco más en vos.'],
   ['Caballero','Si todavía respira, voy a sacarlo de ahí. Dame la armadura.']
  ];
  onDialogueEnd=()=>{armored=true;finaleStep=1;for(const p of players)p.hp=p.max;};
  nextDialogue();
 }else if(finaleStep===3&&nearby(0,-42,3.8)){
  dialogue=[
   ['Rey','Pensé que nadie llegaría. ¿Qué fue lo que llevabas puesto?'],
   ['Caballero','Ya quedó atrás, majestad. Salgamos de acá.'],
   ['Caballero','La armadura se fue. Pero siento algo adentro. Se extiende con cada latido.'],
   ['Caballero','FIN · Expedición de ceniza']
  ];
  onDialogueEnd=()=>{
   finishedStory=true;stop('Rescataste al rey. La corrupción sigue viva. FIN');
  };
  nextDialogue();
 }
}
function exits(dt){
 if(intro){
  narrateRide();
  if(players.some(p=>p.z<-30)||pressed.has('KeyE')){
   intro=false;prologue.visible=false;
   relocate(-1,-49,16);
   tell('Valdorna. Los portones siguen abiertos. Buscá a la capitana junto a la plaza.');
  }
  return;
 }
 crossing=Math.max(0,crossing-dt);
 if(crossing)return;
 if(sector===finaleSector){finaleInteractions();return;}
 if(pressed.has('KeyE')){
  if(explorePoint(localPoint()))return;
  if(sector<0&&!mission&&nearby(-49,14,3.2)){
   dialogue=[
    ['Capitana','El rey salió con su escolta durante el eclipse. Encontramos sus estandartes, pero a él todavía lo buscamos.'],
    ['Caballero','Vi a la guardia caída en el camino. Había criaturas entre los cuerpos. Nunca vi nada así.'],
    ['Capitana','Hasta anoche eran leyendas. Ahora estamos en guerra. Empezá por el Atrio de los Lobos. Ivo va con vos.'],
    ['Ivo','Tengo flechas de sobra. Si la escolta dejó algún rastro, lo vamos a encontrar.']
   ];
   onDialogueEnd=()=>{
    mission=true;archer=actor(0,players[0].x-1.2,players[0].z+1,2);

   };
   nextDialogue();
   return;
  }
  if(sector>=0&&victories.has(sector)&&!reports.has(sector)&&nearby(world.evidence.x,world.evidence.z,3)){
   reports.add(sector);tell(clues[sector]);return;
  }
 }
 if(sector<0){
  if(!pressed.has('KeyE'))return;
  const portal=overworld.routes.find(r=>(r.sector!==finaleSector||reports.has(2))&&nearby(r.x,r.z,2.6));
  if(portal&&mission){relocate(portal.sector,...(districts[portal.sector]??finalSite).entry);return;}
  if(reports.has(1)){
   if(nearby(29,-8,2.3))relocate(-1,29,-29.8);
   else if(nearby(29,-29.8,2.3))relocate(-1,29,-8);
  }
  return;
 }
 const lead=players.find(p=>p.hp&&Math.abs(p.x)<3.4&&
  (p.z>62||p.z<-62&&victories.has(sector)));
 if(!lead)return;
 const route=overworld.routes[sector];
 if(sector===1&&reports.has(1)){
  relocate(-1,29,-4.8);tell('La barca espera al norte. Cerrá este aviso y acercate al muelle para cruzar a Ceniza.');
 }else relocate(-1,route.x,route.z+4.4);
}
const actorUp=new T.Vector3();
function drawActor(a,dt){
 a.flash=Math.max(0,a.flash-dt);
 const back=a.dz<-.48&&Math.abs(a.dx)<.72;
 const row=armored&&a.owner>=0&&a.owner<2?11:a.owner===2?(back?7:3):a.kind===0?(back?6:0):a.art??a.kind;
 const frame=a.flash>0?7:a.wind>0?(a.wind>.21?4:5):a.kind===0&&a.owner<2&&a.cd>.19?6:a.owner===2&&a.cd>.69?5:
  a.dash>0?3:a.moving?1+Math.floor(a.walk)%3:0;
 const uv=a.sprite.geometry.attributes.uv;
 const left=(frame*128+.5)/1024,right=((frame+1)*128-.5)/1024;
 const top=1-(row*128+.5)/2048,bottom=1-((row+1)*128-.5)/2048;
 const flip=a.dx<-.12;
 uv.setXY(0,flip?right:left,top);uv.setXY(1,flip?left:right,top);
 uv.setXY(2,flip?right:left,bottom);uv.setXY(3,flip?left:right,bottom);uv.needsUpdate=true;
 // Tilt the plane toward the elevated camera, pivoting around its painted feet.
 a.sprite.quaternion.copy(camera.quaternion);
 a.sprite.scale.setScalar(a.size);
 const floor=world.floor?.(a.x,a.z)??0;
 const feet=59;
 const lift=(a.art===4?.38+Math.sin(time*5+a.x)*.07:0)+(intro&&a.owner>=0&&a.owner<2?.69:0);
 actorUp.set(0,1,0).applyQuaternion(a.sprite.quaternion);
 a.sprite.position.set(a.x,floor+.018+lift,a.z).addScaledVector(actorUp,(feet/64-.5)*a.size);

 a.sprite.material.color.setHex(a.flash?0xff7d61:a.owner===1?0xb7dac0:a.owner===2?0x91ad78:a.owner===3?0xe5a575:0xffffff);
 a.sprite.visible=a.hp>0;
 a.shadow.position.set(a.x,floor+.017,a.z);a.shadow.scale.set(a.size*(a.kind===2?.29:.31),a.size*(a.kind===2?.14:.22),1);
 if(a.kind===2)a.shadow.material.opacity=.30;
 a.shadow.visible=a.hp>0;
}
function refresh(){
 const active=world.sites[0]?.wave&&enemies.some(e=>e.kind===1)?world.sites[0]:null;
 const done=districts.filter(s=>s.phase===3).length;
 const boss=enemies.find(e=>e.kind===2);
 get('zone').textContent=intro?'Prólogo · Camino a Valdorna':sector<0?'Mapamundi · Marcas del Eclipse':(districts[sector]??finalSite).name;
 const portal=sector<0?overworld.routes.find(r=>(r.sector!==finaleSector||reports.has(2))&&nearby(r.x,r.z,2.6)):null;
 const atDock=sector<0&&(nearby(29,-8,2.3)||nearby(29,-29.8,2.3));
 const clueReady=sector>=0&&victories.has(sector)&&!reports.has(sector);

  const phase=beat%1, accent=Math.floor(beat)%4===0;
  const note=chord[Math.floor(beat)%3]-5, hz=440*Math.pow(2,(note-69)/12);

  const bloom=Math.sin(Math.PI*(beat%4)/4);
  const drone=chord.reduce((sum,n)=>sum+Math.sin(440*Math.pow(2,(n-81)/12)*time*6.283),0)*bloom;
  const drum=mode&&accent?Math.sin(beat*30)*Math.sin(Math.PI*phase)*Math.exp(-phase*9):0;

}

  audio.decodeAudioData(recorded).then(sample=>{steelSample=sample;steelRecorded=true;}).catch(()=>{});
 }
 audio.resume().catch(()=>{});
}
function playSfx(kind){
 if(!audio||!music.checked||audio.state!=='running')return;
 const at=audio.currentTime;
 if(kind==='steel'){
  const hit=audio.createBufferSource();hit.buffer=steelSample;
  if(steelRecorded){
   hit.playbackRate.value=.86;
   const level=audio.createGain();level.gain.value=.85;
   hit.connect(level).connect(musicGain);
  }else hit.connect(musicGain);
  hit.start(at);
  return;
 }
 const duration=kind==='slash'?.11:kind==='impact'?.23:.32;
 const oscillator=audio.createOscillator(), envelope=audio.createGain();
 oscillator.type=kind==='slash'?'triangle':'sawtooth';
 oscillator.frequency.setValueAtTime(kind==='slash'?174:kind==='impact'?88:117,at);
 oscillator.frequency.exponentialRampToValueAtTime(kind==='slash'?74:32,at+duration);
 envelope.gain.setValueAtTime(.001,at);
 envelope.gain.exponentialRampToValueAtTime(kind==='impact'?.085:.058,at+.018);
 envelope.gain.exponentialRampToValueAtTime(.001,at+duration);
 oscillator.connect(envelope).connect(musicGain);oscillator.start(at);oscillator.stop(at+duration);
}
function updateMusic(){
 musicToggle.textContent=music.checked?'Música: sí':'Música: no';
 if(!audio)return;
 const at=audio.currentTime;
 musicGain.gain.setTargetAtTime(+musicVolume.value/100*.58,at,.1);
 const mode=music.checked&&running&&!intro?(enemies.some(e=>e.hp&&e.kind===2)?1:0):-1;
 if(mode===musicMode)return;
 musicMode=mode;
 musicTracks.forEach((gain,i)=>gain.gain.setTargetAtTime(i===mode?1:0,at,.26));
}
music.onchange=()=>{preference('ruinas.music',music.checked?'on':'off');enableMusic();updateMusic();};
musicVolume.oninput=()=>{preference('ruinas.volume',musicVolume.value);updateMusic();};
musicToggle.onclick=()=>{music.checked=!music.checked;music.onchange();};
get('solo').onclick=()=>{enableMusic();start(1);};get('duo').onclick=()=>{enableMusic();start(2);};
get('solo').disabled=get('duo').disabled=false;get('loading').hidden=true;
const allowed=new Set(['KeyE','KeyQ','KeyO',...controls.flatMap(Object.values)]);
addEventListener('keydown',e=>{if(running&&allowed.has(e.code)){e.preventDefault();if(!journal.hidden&&e.code==='KeyE'){
 if(!e.repeat){
  advanceDialogue();
 }
 return;
}if(onDialogueEnd)return;if(!e.repeat)pressed.add(e.code);keys.add(e.code);}});
addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();pressed.clear();});
function resize(){
 const aspect=innerWidth/innerHeight, size=Math.max(13,13/aspect);
 Object.assign(camera,{left:-size*aspect,right:size*aspect,top:size,bottom:-size,near:.1,far:120});
 camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);resize();look.set(-49,0,16);
renderer.setAnimationLoop(now=>{
 const dt=Math.min(.035,Math.max(0,(now-previous)/1000));previous=now;time+=dt;
 if(running&&!onDialogueEnd){
  for(const p of players){
   if(!intro)playerStep(p,dt);
   else{
    const k=controls[p.owner],x=+keys.has(k.right)-+keys.has(k.left),z=+keys.has(k.down)-+keys.has(k.up);
    const length=Math.hypot(x,z)||1;
    walk(p,x/length*8.8*dt,z/length*8.8*dt);p.riding=Boolean(x||z);
    if(x||z){p.dx=x/length;p.dz=z/length;}
   }
  }
  for(const e of enemies)if(e.hp)enemyStep(e,dt);
  for(let i=enemies.length-1;i>=0;i--)if(!enemies[i].hp){effect(enemies[i],.8,0x623427);dispose(enemies[i]);enemies.splice(i,1);}
  stepArcher(dt);progress();overworld.update();exits(dt);pressed.clear();
  if(players.every(p=>!p.hp))stop('La expedición cayó. Elegí un modo para volver a intentarlo.');
  hudTime-=dt;if(hudTime<=0){refresh();hudTime=.1;}
 }
 for(let i=effects.length-1;i>=0;i--){
  const e=effects[i];e.life-=dt;
  if(e.life<=0){clearEffect(e);effects.splice(i,1);continue;}
  if(e.particles){
   const t=e.max-e.life;
   for(const p of e.particles){
    p.mesh.position.set(p.x+p.vx*t,Math.max(.07,.12+p.vy*t-3.4*t*t),p.z+p.vz*t);
    p.mesh.scale.setScalar(Math.max(.08,e.life/e.max));
   }
  }else if(e.sky){
   const remaining=Math.max(0,e.life-.22);
   e.ring.visible=remaining<.46;
   e.ring.position.y=1.15+19*Math.pow(remaining/.46,1.25);
   if(remaining===0)e.ring.scale.setScalar(Math.max(.08,e.life/.22));
  }else e.ring.material.opacity=Math.max(0,e.life/e.max*.72);
 }
 const alive=players.filter(p=>p.hp);
 if(alive.length){
  const x=alive.reduce((sum,p)=>sum+p.x,0)/alive.length,z=alive.reduce((sum,p)=>sum+p.z,0)/alive.length;
  look.x+=(x-look.x)*(1-Math.exp(-dt*7));look.z+=(z-look.z)*(1-Math.exp(-dt*7));
  const spread=alive.length===2?Math.hypot(alive[0].x-alive[1].x,alive[0].z-alive[1].z):0;
  const aspect=innerWidth/innerHeight,desired=Math.min(1,23/Math.max(23,spread/aspect,spread*.8));
  camera.zoom+=(desired-camera.zoom)*(1-Math.exp(-dt*4));camera.updateProjectionMatrix();
 }
 camera.position.set(look.x,24,look.z+18);camera.lookAt(look);

 if(intro)mounts.forEach(({group,legs},i)=>{
  const p=players[i];group.position.set(p.x,0,p.z);group.rotation.y=Math.atan2(-p.dx,-p.dz);
  legs.forEach((leg,j)=>leg.rotation.x=p.riding?Math.sin(time*14+j*Math.PI*.5)*.38:0);
 });
 drawMarkers();
 if(captain){
  drawActor(captain,dt);
  captain.sprite.visible=captain.shadow.visible=sector<0&&!intro;
 }
 for(const a of [...players,...enemies])drawActor(a,dt);
 if(archer)drawActor(archer,dt);
 if(envoy){
  drawActor(envoy,dt);envoy.sprite.visible=envoy.shadow.visible=sector===finaleSector&&finaleStep===0;
  drawActor(king,dt);king.sprite.visible=king.shadow.visible=sector===finaleSector;
 }
 updateMusic();
 renderer.render(scene,camera);
});
</script>
